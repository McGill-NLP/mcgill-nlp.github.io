<!-- Add favicon -->
<link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/logo/favicon.ico">

<!-- DM Sans font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- SEO meta tags -->
<meta name="author" content="{% if page.names %}{{ page.names }}{% else %}{{ page.title }}{% endif %}">
<meta name="description"
    content="{% if page.abstract %}{{ page.abstract | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

<!-- Open Graph and Twitter Card data -->
<meta property="og:type" content="{% if page.layout == 'publication' %}article{% else %}profile{% endif %}">
<meta property="og:locale" content="en_US">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description"
    content="{% if page.abstract %}{{ page.abstract | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
{% if page.openAccessPdf.url %}
<meta property="og:url" content="{{ page.openAccessPdf.url }}">{% endif %}


<!-- particles.js: only splash layouts (page__hero_particles.html) have a #particles-js container -->
{% if page.layout contains "splash" %}
<script defer src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script defer src="{{ '/assets/js/particles-config.js' | relative_url }}"></script>
{% endif %}
