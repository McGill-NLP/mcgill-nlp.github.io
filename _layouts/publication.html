---
layout: single
---

{% include breadcrumbs-schema.html %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ScholarlyArticle",
  "headline": "{{ page.title }}",
  "author": [
    {% assign authors = page.names | split: ", " %}
    {% for author in authors %}
    {
      "@type": "Person",
      "name": "{{ author }}"
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ],
  "datePublished": "{{ page.name | slice: 0,10 }}",
  "publisher": "{{ page.venue }}",
  {% if page.openAccessPdf.url %}
  "url": "{{ page.openAccessPdf.url }}",
  {% endif %}
  {% if page.abstract %}
  "abstract": {{ page.abstract | jsonify }},
  {% endif %}
  {% if page.tags %}
  "keywords": {{ page.tags | jsonify }},
  {% endif %}
  "isAccessibleForFree": {% if page.openAccessPdf.status == "OPEN" %}true{% else %}false{% endif %}
}
</script>

<a class="back-to-publications" href="{{ '/publications/' | relative_url }}"><span aria-hidden="true">&larr;</span> All publications</a>
<script>
  // Move the back link above the page title (which the theme renders before this content).
  (function (link) {
    var header = link.closest('.page__inner-wrap') && link.closest('.page__inner-wrap').querySelector('header');
    if (header) header.parentNode.insertBefore(link, header);
  })(document.currentScript.previousElementSibling);
</script>

{{ content }}

<div>
  {% include posts-publication.html taxonomy=page.taxonomy %}
</div>
